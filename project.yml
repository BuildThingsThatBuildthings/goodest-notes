name: Blockbook
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '2'
    SUPPORTS_MACCATALYST: YES
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.3.0'
    CURRENT_PROJECT_VERSION: '9'
targets:
  Blockbook:
    type: application
    platform: iOS
    sources: [Blockbook]
    info:
      path: Blockbook/Info.plist
      properties:
        CFBundleDisplayName: Goodest Notes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.btbt.blockbook
            CFBundleURLSchemes: [blockbook, goodestnotes]
        NSLocalNetworkUsageDescription: Goodest Notes uses the local network when you start an encrypted connection to your agent.
        NSMicrophoneUsageDescription: Goodest Notes records audio notes when you tap Record audio note on a canvas item.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.btbt.blockbook
        TARGETED_DEVICE_FAMILY: '2'
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    scheme:
      testTargets: [BlockbookTests]
  BlockbookTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Blockbook
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.btbt.blockbook.tests
